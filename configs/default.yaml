system:
  mode: synthetic
  sensor_version: "0.1.0"
  live_capture: true
window:
  size_seconds: 5
  slide_seconds: 1
models:
  xgboost: true
  lstm: true
  fft: true
  kitsune: true
  isolation_forest: true
model_artifacts:
  xgboost: models/xgboost.json
  lstm: models/lstm.json
  fft: models/fft.json
  kitsune: models/kitsune.json
  isolation_forest: models/isolation_forest.joblib
fusion:
  xgboost: 0.40
  lstm: 0.20
  fft: 0.15
  kitsune: 0.15
  isolation_forest: 0.10
consensus:
  min_agreeing_models: 2
  vote_threshold: 0.50
  high_confidence_override: 0.90
risk:
  critical: 0.85
  warning: 0.60
  high: 0.60
  info: 0.35
  medium: 0.35
  low: 0.20
persistence:
  enabled: true
  consecutive_windows: 3
  cooldown_seconds: 30
retention:
  raw_events_days: 7
  features_days: 30
  alerts_days: 365
security:
  api_key_required: false
  allow_payload: false
