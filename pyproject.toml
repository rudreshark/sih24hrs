[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diodeshield"
version = "0.1.0"
description = "Passive receive-side OT traffic detection prototype"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.104,<1",
  "uvicorn[standard]>=0.24,<1",
  "pydantic>=2,<3",
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
  "psutil>=5.9,<8",
  "scapy>=2.5,<3",
  "groq>=0.11,<1",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3,<2", "xgboost>=2,<3", "torch>=2,<3", "shap>=0.44,<1", "scipy>=1.11,<2", "pandas>=2,<4"]
dev = ["pytest>=7,<9", "httpx>=0.25,<1", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["diodeshield*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:.*Using .httpx. with .starlette.testclient. is deprecated.*:DeprecationWarning",
  "ignore:.*BlockingPortal alias is deprecated.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741", "F841"]
